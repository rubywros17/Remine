plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.remine'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.google.firebase:firebase-admin:9.11.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// 테스트는 개발자 PC의 키·설정과 무관하게 같은 결과여야 하고, 실제 API를 부르지 않는다.
	// - REMINE_ENV_FILE·~/.remine.env 대신 존재하지 않는 경로를 읽게 한다 (user.home은 건드리지 않는다)
	// - OS 환경변수의 키·분류기 선택을 중립화한다 (빈 키 = 키 없음)
	systemProperty 'remine.env-file', layout.buildDirectory.file('no-remine.env').get().asFile.absolutePath
	environment 'GEMINI_API_KEY', ''
	environment 'REMINE_CLASSIFIER', 'fake'
	// - 주간 관심사 집계가 테스트 도중 실제 시각에 돌지 않게 끈다("-" = cron 비활성). 테스트는 메서드를 직접 부른다.
	systemProperty 'remine.interest.alert-cron', '-'
	// - 관심사 알림 발송도 끄고, FCM 키 파일 경로를 비워 실제 Firebase에 붙지 않게 한다(테스트는 가짜 sender를 주입).
	systemProperty 'remine.push.send-cron', '-'
	systemProperty 'remine.fcm.credentials-file', ''
	// - DB는 Testcontainers가 띄운 PostgreSQL(docker-compose.yml과 같은 버전). Docker가 켜져 있어야 한다.
	//   테스트 실행 동안 컨테이너 하나를 모든 Spring 컨텍스트가 공유한다.
	systemProperty 'spring.datasource.url', 'jdbc:tc:postgresql:17.6:///remine?reWriteBatchedInserts=true'
	//   컨텍스트는 캐시돼 풀을 쥔 채 남으므로, 풀을 작게 해 컨텍스트 수 × 풀 크기가 max_connections(100)를 넘지 않게 한다.
	systemProperty 'spring.datasource.hikari.maximum-pool-size', '2'
}

// Windows 콘솔에서 한글 로그가 깨지지 않도록 bootRun JVM의 인코딩을 UTF-8로 고정한다.
tasks.named('bootRun') {
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}
