logging:
  charset:
    console: UTF-8
  level:
    # 읽을 수 없는 JSON 본문을 처리할 때 이 로거가 DEBUG에서 잘못된 값(OCR 원문 등)이 든 예외 메시지를 찍는다.
    # 상위(org.springframework.web)를 DEBUG로 올려도 본문 내용이 로그에 남지 않게 고정한다.
    org.springframework.web.method.HandlerMethod: INFO
    # @ExceptionHandler로 처리된 예외도 DEBUG에서 "Resolved [예외]"로 메시지를 찍는다.
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO

spring:
  application:
    name: server
  config:
    # API 키를 셸 export 없이 읽는다. 파일은 레포 밖(사용자 홈)이라 커밋되지 않는다.
    # 내용 예: GEMINI_API_KEY=키값 (따옴표 없이, BOM 없는 UTF-8). 같은 이름의 환경변수가 있으면 환경변수가 우선한다.
    # 위치는 remine.env-file(환경변수 REMINE_ENV_FILE)로 바꿀 수 있다 (테스트는 존재하지 않는 경로를 지정해 사용자 파일을 읽지 않는다).
    import: "optional:file:${remine.env-file:${user.home}/.remine.env}[.properties]"
  datasource:
    # 로컬은 docker-compose.yml의 PostgreSQL(호스트 포트 5433). 배포는 SPRING_DATASOURCE_URL·USERNAME·PASSWORD 환경변수로 덮어쓴다.
    # reWriteBatchedInserts: JDBC 배치 INSERT를 다중 VALUES 한 문장으로 보낸다.
    url: jdbc:postgresql://localhost:5433/remine?reWriteBatchedInserts=true
    username: remine
    # 키 파일(remine.env) 또는 환경변수의 REMINE_DB_PASSWORD. docker compose도 같은 값을 읽는다.
    password: ${REMINE_DB_PASSWORD:}
  flyway:
    # 스키마는 db/migration의 Flyway 스크립트만 바꾼다. 적용된 V 파일은 고치지 말고 새 버전을 추가한다.
    locations: classpath:db/migration
  jpa:
    # 요청 내내 세션(DB 연결)을 쥐지 않는다. analyze는 LLM 호출 중 DB를 점유하지 않도록 서비스에서 트랜잭션을 나눴다.
    open-in-view: false
    hibernate:
      # Hibernate는 스키마를 만들지 않고 엔티티와 Flyway 스키마가 맞는지만 확인한다(안 맞으면 기동 실패).
      ddl-auto: validate
    properties:
      hibernate:
        # ID가 SEQUENCE(allocationSize 50)라 INSERT를 모아 보낼 수 있다. analyze 저장이 캡처·태그 연결 수만큼 왕복하지 않게.
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  servlet:
    multipart:
      # 분석용 이미지는 디스크에 쓰지 않는다. file-size-threshold 기본값 0B는 모든 파트를 임시 파일로 쓰므로,
      # 어떤 파트보다 크게 잡아 항상 메모리에서만 처리한다. 상한은 remine.image.*와 같은 값을 쓴다.
      file-size-threshold: 256MB
      max-file-size: ${remine.image.max-part-bytes}B
      max-request-size: ${remine.image.max-request-bytes}B

remine:
  classifier: fake        # fake(키워드 임시 구현) | gemini(실제 LLM, GEMINI_API_KEY 필요)
  analyze:
    # analyze 요청 하나에 담을 수 있는 최대 캡처 수. 초과하면 400. (호출이 순차라 장수만큼 요청이 길어진다)
    max-batch-size: 20
    # 요청 마감: 지나면 새 LLM 호출을 시작하지 않고 남은 캡처는 DEADLINE_EXCEEDED(앱이 다음 실행에 다시 보냄).
    # 앱 타임아웃(5분)보다 짧게 둔다. 이미 시작한 호출(read-timeout 60s·재시도)은 끝까지 기다린다.
    deadline: 4m
  image:
    max-bytes: 1048576           # 장당 1MB 초과 → 그 캡처만 IMAGE_TOO_LARGE
    max-long-side: 1024          # 서버가 이보다 긴 변은 축소
    max-pixels: 25000000         # 디코딩 전 픽셀 수 상한 (압축폭탄 방어)
    max-request-bytes: 12582912  # 요청 전체 하드 상한 12MB → 413
    max-part-bytes: 5242880      # 파트 하나 하드 상한 5MB → 413
  tags:
    # 저장하지 않는 태그. 화면 문구는 관심사가 아니고, 카테고리명은 카테고리가 이미 말해 준다.
    # 비교는 '#'·공백·대소문자를 무시한다("무료 배송" = "무료배송").
    stopwords:
      # 쇼핑·SNS 화면 문구
      - 장바구니
      - 무료배송
      - 구매하기
      - 바로구매
      - 구매
      - 결제
      - 쿠폰
      - 리뷰
      - 좋아요
      - 공유
      - 팔로우
      - 저장
      - 더보기
      - 로그인
      - 검색
      - 광고
      - 스크린샷
      - 캡처
      # 카테고리명 (spec 5장)
      - 쇼핑
      - 문화생활
      - 맛집
      - 장소
      - 맛집/장소
      - 정보
      - 꿀팁
      - 정보/꿀팁
      - 대화
      - 일정
      - 예약
      - 일정/예약
      - 기타
  interest:
    window-days: 14              # 최근 14일(taken_at) 안의 캡처만 본다
    min-count: 3                 # 같은 태그가 3번 이상이면 관심사
    alert-cooldown-days: 28      # 같은 태그로 알림 후보를 다시 만들지 않는 기간
    alert-cron: "0 0 10 * * MON" # 주간 집계(Asia/Seoul). 실기기 확인 때는 "*/30 * * * * *"처럼 짧게
  push:
    # 이번 주 PENDING 알림 발송·재시도(Asia/Seoul). 밤에는 보내지 않는다. 실기기 확인 때는 "*/30 * * * * *"
    send-cron: "0 */30 10-21 * * *"
  fcm:
    # Firebase 서비스 계정 키 경로. 키 파일(remine.env)에서 채운다. 비었거나 파일이 없으면 푸시만 꺼진다.
    credentials-file: ""
  llm:
    image-threshold-chars: 150   # OCR 글자 수(공백 제외)가 이 값 미만이고 이미지가 있으면 이미지도 함께 전송
    gemini:
      model: gemini-3.5-flash-lite
      temperature: 1.0           # Gemini 3 공식 권장값
      base-url: https://generativelanguage.googleapis.com
      connect-timeout: 10s
      read-timeout: 60s
      # 연속 호출 시작 사이 최소 간격(ms). 4500 = 무료 등급 RPM 15 기준.
      # 유료 등급이면 낮추거나 0으로 둔다. (호출은 순차라 요청 하나의 LLM 호출 수만큼 이 간격이 붙는다)
      min-interval-ms: 4500
    batch:
      # LLM 요청 하나에 묶는 캡처 수. 1이면 장당 1요청(배치 끔, 전/후 측정 비교용).
      # 누락·해석 실패한 장만 단건으로 다시 보낸다. 텍스트만/이미지 포함은 따로 묶는다.
      text-size: 10
      image-size: 5
